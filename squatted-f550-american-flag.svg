<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Squatted personal F-550 concept with American flag livery</title>
  <desc id="desc">Stylized lowered-rear, raised-front truck profile inspired by an F-550 with stars and stripes paint.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9ecff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f7fb"/>
      <stop offset="50%" stop-color="#c5c9d4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1a1f2b" flood-opacity="0.35"/>
    </filter>
    <clipPath id="cabClip">
      <path d="M390 305 L640 305 L710 350 L820 350 L840 430 L390 430 Z"/>
    </clipPath>
    <clipPath id="bedClip">
      <path d="M840 350 L1190 350 L1218 430 L840 430 Z"/>
    </clipPath>
    <g id="star" fill="#ffffff">
      <polygon points="0,-10 2.9,-3.1 10,-3.1 4.1,1.2 6.3,8.5 0,4.2 -6.3,8.5 -4.1,1.2 -10,-3.1 -2.9,-3.1"/>
    </g>
  </defs>

  <rect width="1400" height="800" fill="url(#sky)"/>
  <rect x="0" y="560" width="1400" height="240" fill="#b7c4d6"/>
  <rect x="0" y="590" width="1400" height="210" fill="#9aa9bd"/>

  <!-- Truck shadow -->
  <ellipse cx="760" cy="560" rx="430" ry="42" fill="#3f4a5c" opacity="0.45"/>

  <!-- Truck body -->
  <g filter="url(#shadow)">
    <path d="M340 430 L340 355 Q340 320 378 306 L640 306 L710 350 L1190 350 Q1220 350 1232 376 L1248 430 Z" fill="#e5e9f3"/>
    <path d="M390 305 L640 305 L710 350 L840 350 L840 430 L390 430 Z" fill="#ffffff"/>
    <path d="M840 350 L1190 350 L1218 430 L840 430 Z" fill="#f3f5fa"/>

    <!-- American flag livery across cab and bed -->
    <g clip-path="url(#cabClip)">
      <rect x="390" y="305" width="450" height="125" fill="#ffffff"/>
      <rect x="390" y="317" width="450" height="12" fill="#c1121f"/>
      <rect x="390" y="341" width="450" height="12" fill="#c1121f"/>
      <rect x="390" y="365" width="450" height="12" fill="#c1121f"/>
      <rect x="390" y="389" width="450" height="12" fill="#c1121f"/>
      <rect x="390" y="413" width="450" height="12" fill="#c1121f"/>
      <rect x="390" y="305" width="175" height="90" fill="#002868"/>
      <g transform="translate(417 327) scale(0.75)">
        <use href="#star" x="0" y="0"/><use href="#star" x="34" y="0"/><use href="#star" x="68" y="0"/><use href="#star" x="102" y="0"/>
        <use href="#star" x="17" y="24"/><use href="#star" x="51" y="24"/><use href="#star" x="85" y="24"/><use href="#star" x="119" y="24"/>
        <use href="#star" x="0" y="48"/><use href="#star" x="34" y="48"/><use href="#star" x="68" y="48"/><use href="#star" x="102" y="48"/>
      </g>
    </g>

    <g clip-path="url(#bedClip)">
      <rect x="840" y="350" width="380" height="80" fill="#ffffff"/>
      <rect x="840" y="360" width="380" height="10" fill="#c1121f"/>
      <rect x="840" y="380" width="380" height="10" fill="#c1121f"/>
      <rect x="840" y="400" width="380" height="10" fill="#c1121f"/>
      <rect x="840" y="420" width="380" height="10" fill="#c1121f"/>
      <polygon points="920,350 1010,350 840,430 840,390" fill="#002868" opacity="0.92"/>
      <g transform="translate(900 378) scale(0.5)">
        <use href="#star" x="0" y="0"/><use href="#star" x="35" y="0"/><use href="#star" x="70" y="0"/>
      </g>
    </g>

    <!-- Windows -->
    <path d="M425 325 L628 325 L675 350 L465 350 Q438 350 425 337 Z" fill="#6f8fb1" opacity="0.95"/>
    <path d="M678 350 L804 350 L812 382 L704 382 Z" fill="#6f8fb1" opacity="0.95"/>

    <!-- Details -->
    <rect x="1115" y="366" width="95" height="12" rx="4" fill="url(#chrome)"/>
    <rect x="350" y="368" width="42" height="20" rx="4" fill="#ff9f1c"/>
    <rect x="1210" y="372" width="28" height="24" rx="4" fill="#d90429"/>

    <!-- Grill and bumper -->
    <rect x="340" y="380" width="72" height="50" rx="8" fill="#2c3a4f"/>
    <rect x="337" y="405" width="78" height="20" rx="6" fill="url(#chrome)"/>
    <line x1="350" y1="389" x2="402" y2="389" stroke="#7d8ca3" stroke-width="4"/>
    <line x1="350" y1="399" x2="402" y2="399" stroke="#7d8ca3" stroke-width="4"/>

    <!-- Lifted front / lowered rear stance (squatted) -->
    <circle cx="500" cy="515" r="112" fill="#111723"/>
    <circle cx="500" cy="515" r="72" fill="#d6dde9"/>
    <circle cx="500" cy="515" r="26" fill="#8d99ae"/>

    <circle cx="1015" cy="552" r="90" fill="#111723"/>
    <circle cx="1015" cy="552" r="58" fill="#d6dde9"/>
    <circle cx="1015" cy="552" r="21" fill="#8d99ae"/>

    <!-- Fender outlines -->
    <path d="M410 430 Q500 360 590 430" fill="none" stroke="#8fa0b7" stroke-width="8"/>
    <path d="M930 430 Q1015 388 1100 430" fill="none" stroke="#8fa0b7" stroke-width="7"/>
  </g>

  <text x="700" y="715" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" fill="#1f2a44" font-weight="700">Squatted Personal F-550 • American Flag Livery Concept</text>
</svg>
